name: Update achievements badges

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  my-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate dynamic achievement badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "Token length: ${#GITHUB_TOKEN}"
          echo "User: $GITHUB_USER"
          echo "Repo: $GITHUB_REPO"
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "GITHUB_TOKEN is empty. Enable Actions workflow permissions."
            exit 1
          fi
          npx --yes update-my-badges "$GITHUB_USER" --token="$GITHUB_TOKEN" --repo="$GITHUB_REPO" --compact --size=56

      - name: Create pull request for badge updates
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-achievement-badges
          commit-message: "chore: update dynamic achievement badges"
          title: "chore: update dynamic achievement badges"
          body: |
            Automated update of profile achievement badges.

            - Regenerated badges via `update-my-badges`
            - Updated README badge section and badge metadata files
          delete-branch: true
