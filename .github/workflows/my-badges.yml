name: Update achievements badges

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  my-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate dynamic achievement badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "GITHUB_TOKEN is empty. Enable Actions workflow permissions."
            exit 1
          fi
          npx --yes update-my-badges "${{ github.repository_owner }}" --repo="${{ github.repository }}" --token="$GITHUB_TOKEN" --compact --size=56
