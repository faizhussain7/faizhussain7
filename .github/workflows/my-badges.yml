name: Update achievements badges

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 2 1 */3 *"

permissions:
  contents: write
  pull-requests: write

jobs:
  my-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate dynamic achievement badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "Token length: ${#GITHUB_TOKEN}"
          echo "User: $GITHUB_USER"
          echo "Repo: $GITHUB_REPO"
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "GITHUB_TOKEN is empty. Enable Actions workflow permissions."
            exit 1
          fi
          npx --yes update-my-badges "$GITHUB_USER" --token="$GITHUB_TOKEN" --repo="$GITHUB_REPO" --compact --size=56 --dryrun

      - name: Sync generated badges into workspace
        run: |
          if [ -f repo/README.md ]; then
            cp repo/README.md README.md
          fi
          if [ -d repo/my-badges ]; then
            rm -rf my-badges
            cp -R repo/my-badges my-badges
          fi
          git status --short

      - name: Update official achievements and open-source contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from urllib.error import URLError, HTTPError
          from urllib.parse import quote

          user = os.environ.get("GITHUB_USER") or "${{ github.repository_owner }}"
          token = os.environ.get("GITHUB_TOKEN", "")
          readme_path = "README.md"

          start_marker = "<!-- official-achievements start -->"
          end_marker = "<!-- official-achievements end -->"
          dyn_start_marker = "<!-- my-badges start -->"
          dyn_end_marker = "<!-- my-badges end -->"
          oss_start_marker = "<!-- open-source-contributions start -->"
          oss_end_marker = "<!-- open-source-contributions end -->"
          oss_limit = 5

          achievement_defs = [
              ("Quickdraw", "quickdraw-default.png"),
              ("Pull Shark", "pull-shark-default.png"),
              ("Pair Extraordinaire", "pair-extraordinaire-default.png"),
              ("Starstruck", "starstruck-default.png"),
              ("Galaxy Brain", "galaxy-brain-default.png"),
              ("YOLO", "yolo-default.png"),
          ]

          def api_get(url):
              headers = {
                  "User-Agent": "faizhussain7-profile-readme",
                  "Accept": "application/vnd.github+json",
              }
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=25) as resp:
                  return json.load(resp)

          # --- Official achievements ---
          html = ""
          for url in [f"https://github.com/{user}?tab=achievements", f"https://github.com/{user}"]:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0", "Accept": "text/html"})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      html = resp.read().decode("utf-8", errors="ignore")
                  if html:
                      break
              except (URLError, HTTPError):
                  continue

          found = []
          lower_html = html.lower()
          for name, icon_file in achievement_defs:
              if name.lower() in lower_html:
                  found.append((name, icon_file))

          badge_lines = []
          if found:
              badge_lines.append('<p align="center">')
              for name, icon_file in found:
                  badge_lines.append(
                      f'  <img src="https://github.githubassets.com/images/modules/profile/achievements/{icon_file}" alt="{name}" title="{name}" width="64" />'
                  )
              badge_lines.append("</p>")
          else:
              badge_lines.append("_No public GitHub achievements detected from profile page yet._")

          with open(readme_path, "r", encoding="utf-8") as f:
              content = f.read()

          pattern = re.compile(re.escape(start_marker) + r".*?" + re.escape(end_marker), re.DOTALL)
          content = pattern.sub(f"{start_marker}\n" + "\n".join(badge_lines) + f"\n{end_marker}", content)

          # --- Dynamic my-badges ---
          dynamic_block_lines = []
          json_path = os.path.join("my-badges", "my-badges.json")
          if os.path.exists(json_path):
              try:
                  with open(json_path, "r", encoding="utf-8") as jf:
                      badges = json.load(jf)
                  if isinstance(badges, list) and badges:
                      dynamic_block_lines.append('<p align="center">')
                      for badge in badges:
                          badge_id = str(badge.get("id", "badge")).replace("-", " ").title()
                          desc = str(badge.get("desc", "Dynamic Badge"))
                          file_id = str(badge.get("id", "badge"))
                          icon_url = str(badge.get("image", "")).strip()
                          if not icon_url:
                              continue
                          dynamic_block_lines.append(
                              f'  <a href="my-badges/{file_id}.md" title="{desc}"><img src="{icon_url}" alt="{badge_id}" width="64" /></a>'
                          )
                      dynamic_block_lines.append("</p>")
                  else:
                      dynamic_block_lines.append("_No dynamic badges generated yet._")
              except Exception:
                  dynamic_block_lines.append("_Dynamic badge data could not be parsed._")
          else:
              dynamic_block_lines.append("_No dynamic badges generated yet._")

          dyn_pattern = re.compile(re.escape(dyn_start_marker) + r".*?" + re.escape(dyn_end_marker), re.DOTALL)
          content = dyn_pattern.sub(
              f"{dyn_start_marker}\n" + "\n".join(dynamic_block_lines) + f"\n{dyn_end_marker}",
              content,
          )

          # --- Open source external merged PRs ---
          oss_lines = []
          try:
              q = quote(f"author:{user} type:pr is:merged -user:{user}")
              data = api_get(f"https://api.github.com/search/issues?q={q}&sort=updated&order=desc&per_page={oss_limit}")
              items = data.get("items") or []
              if items:
                  seen_repos = set()
                  oss_lines.append('<p align="left">')
                  for item in items:
                      repo_url = (item.get("repository_url") or "").strip()
                      # repository_url like https://api.github.com/repos/owner/name
                      repo_full = ""
                      if "/repos/" in repo_url:
                          repo_full = repo_url.split("/repos/")[-1]
                      html_url = item.get("html_url") or ""
                      title = (item.get("title") or "PR").strip()
                      if not repo_full:
                          continue
                      # one line per unique repo (most recent PR title)
                      if repo_full in seen_repos:
                          continue
                      seen_repos.add(repo_full)
                      oss_lines.append(
                          f'- <a href="{html_url}"><b>{repo_full}</b></a> — {title}'
                      )
                      if len(seen_repos) >= oss_limit:
                          break
                  oss_lines.append("</p>")
                  if not seen_repos:
                      oss_lines = ["_No external merged PRs found yet._"]
              else:
                  oss_lines.append("_No external merged PRs found yet._")
          except (URLError, HTTPError, json.JSONDecodeError, TimeoutError, KeyError) as e:
              oss_lines.append(f"_Open source contributions could not be fetched right now._")

          oss_pattern = re.compile(re.escape(oss_start_marker) + r".*?" + re.escape(oss_end_marker), re.DOTALL)
          content = oss_pattern.sub(
              f"{oss_start_marker}\n" + "\n".join(oss_lines) + f"\n{oss_end_marker}",
              content,
          )

          with open(readme_path, "w", encoding="utf-8") as f:
              f.write(content)
          print("README updated: achievements, my-badges, open-source contributions")
          PY

      - name: Create pull request for badge updates
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-achievement-badges
          add-paths: |
            README.md
            my-badges/**
          commit-message: "chore: update dynamic achievement badges and open-source contributions"
          title: "chore: update dynamic achievement badges and open-source contributions"
          body: |
            Automated update of profile achievement badges and open-source contributions.
            - Regenerated badges via `update-my-badges`
            - Updated README badge sections
            - Refreshed external merged PR list from the GitHub Search API
          delete-branch: true
