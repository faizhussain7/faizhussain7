name: Update achievements badges

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  my-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate dynamic achievement badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "Token length: ${#GITHUB_TOKEN}"
          echo "User: $GITHUB_USER"
          echo "Repo: $GITHUB_REPO"
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "GITHUB_TOKEN is empty. Enable Actions workflow permissions."
            exit 1
          fi
          npx --yes update-my-badges "$GITHUB_USER" --token="$GITHUB_TOKEN" --repo="$GITHUB_REPO" --compact --size=56 --dryrun

      - name: Sync generated badges into workspace
        run: |
          if [ -f repo/README.md ]; then
            cp repo/README.md README.md
          fi
          if [ -d repo/my-badges ]; then
            rm -rf my-badges
            cp -R repo/my-badges my-badges
          fi
          git status --short

      - name: Update official achievements badges dynamically
        env:
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from urllib.error import URLError, HTTPError

          user = "${{ github.repository_owner }}"
          readme_path = "README.md"
          start_marker = "<!-- official-achievements start -->"
          end_marker = "<!-- official-achievements end -->"

          achievement_defs = [
              ("Quickdraw", "1F6FEB"),
              ("Pull Shark", "58A6FF"),
              ("Pair Extraordinaire", "8250DF"),
              ("Starstruck", "0969DA"),
              ("Galaxy Brain", "0A3069"),
              ("YOLO", "218BFF"),
          ]

          html = ""
          urls = [
              f"https://github.com/{user}?tab=achievements",
              f"https://github.com/{user}",
          ]
          for url in urls:
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0", "Accept": "text/html"},
                  )
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      html = resp.read().decode("utf-8", errors="ignore")
                  if html:
                      break
              except (URLError, HTTPError):
                  continue

          found = []
          lower_html = html.lower()
          for name, color in achievement_defs:
              if name.lower() in lower_html:
                  found.append((name, color))

          badge_lines = []
          if found:
              badge_lines.append('<p align="center">')
              for name, color in found:
                  label = name.replace(" ", "%20")
                  badge_lines.append(
                      f'  <img src="https://img.shields.io/badge/Achievement-{label}-{color}?style=for-the-badge&logo=github&logoColor=white" />'
                  )
              badge_lines.append("</p>")
          else:
              badge_lines.append("_No public GitHub achievements detected from profile page yet._")

          block = "\n".join(badge_lines)

          with open(readme_path, "r", encoding="utf-8") as f:
              content = f.read()

          pattern = re.compile(
              re.escape(start_marker) + r".*?" + re.escape(end_marker),
              re.DOTALL,
          )
          replacement = f"{start_marker}\n{block}\n{end_marker}"
          new_content = pattern.sub(replacement, content)

          with open(readme_path, "w", encoding="utf-8") as f:
              f.write(new_content)
          PY

      - name: Create pull request for badge updates
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-achievement-badges
          add-paths: |
            README.md
            my-badges/**
          commit-message: "chore: update dynamic achievement badges"
          title: "chore: update dynamic achievement badges"
          body: |
            Automated update of profile achievement badges.

            - Regenerated badges via `update-my-badges`
            - Updated README badge section and badge metadata files
          delete-branch: true
