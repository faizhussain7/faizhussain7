name: Update achievements badges

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 2 1 */3 *"

permissions:
  contents: write
  pull-requests: write

jobs:
  my-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate dynamic achievement badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "Token length: ${#GITHUB_TOKEN}"
          echo "User: $GITHUB_USER"
          echo "Repo: $GITHUB_REPO"
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "GITHUB_TOKEN is empty. Enable Actions workflow permissions."
            exit 1
          fi
          npx --yes update-my-badges "$GITHUB_USER" --token="$GITHUB_TOKEN" --repo="$GITHUB_REPO" --compact --size=56 --dryrun

      - name: Sync generated badges into workspace
        run: |
          if [ -f repo/README.md ]; then
            cp repo/README.md README.md
          fi
          if [ -d repo/my-badges ]; then
            rm -rf my-badges
            cp -R repo/my-badges my-badges
          fi
          git status --short

      - name: Update official achievements badges dynamically
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from urllib.error import URLError, HTTPError
          from urllib.parse import quote

          user = "${{ github.repository_owner }}"
          token = os.environ.get("GITHUB_TOKEN", "")
          readme_path = "README.md"
          start_marker = "<!-- official-achievements start -->"
          end_marker = "<!-- official-achievements end -->"
          dyn_start_marker = "<!-- my-badges start -->"
          dyn_end_marker = "<!-- my-badges end -->"
          repos_start_marker = "<!-- top-repositories start -->"
          repos_end_marker = "<!-- top-repositories end -->"
          repos_limit = 2

          achievement_defs = [
              ("Quickdraw", "quickdraw-default.png"),
              ("Pull Shark", "pull-shark-default.png"),
              ("Pair Extraordinaire", "pair-extraordinaire-default.png"),
              ("Starstruck", "starstruck-default.png"),
              ("Galaxy Brain", "galaxy-brain-default.png"),
              ("YOLO", "yolo-default.png"),
          ]

          html = ""
          urls = [
              f"https://github.com/{user}?tab=achievements",
              f"https://github.com/{user}",
          ]
          for url in urls:
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0", "Accept": "text/html"},
                  )
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      html = resp.read().decode("utf-8", errors="ignore")
                  if html:
                      break
              except (URLError, HTTPError):
                  continue

          found = []
          lower_html = html.lower()
          for name, icon_file in achievement_defs:
              if name.lower() in lower_html:
                  found.append((name, icon_file))

          badge_lines = []
          if found:
              badge_lines.append('<p align="center">')
              for name, icon_file in found:
                  badge_lines.append(
                      f'  <img src="https://github.githubassets.com/images/modules/profile/achievements/{icon_file}" alt="{name}" title="{name}" width="64" />'
                  )
              badge_lines.append("</p>")
          else:
              badge_lines.append("_No public GitHub achievements detected from profile page yet._")

          block = "\n".join(badge_lines)

          with open(readme_path, "r", encoding="utf-8") as f:
              content = f.read()

          pattern = re.compile(
              re.escape(start_marker) + r".*?" + re.escape(end_marker),
              re.DOTALL,
          )
          replacement = f"{start_marker}\n{block}\n{end_marker}"
          new_content = pattern.sub(replacement, content)

          # Build dynamic badges from local my-badges JSON (real badge images)
          dynamic_block_lines = []
          json_path = os.path.join("my-badges", "my-badges.json")
          if os.path.exists(json_path):
              try:
                  with open(json_path, "r", encoding="utf-8") as jf:
                      badges = json.load(jf)
                  if isinstance(badges, list) and badges:
                      dynamic_block_lines.append('<p align="center">')
                      for badge in badges:
                          badge_id = str(badge.get("id", "badge")).replace("-", " ").title()
                          desc = str(badge.get("desc", "Dynamic Badge"))
                          file_id = str(badge.get("id", "badge"))
                          icon_url = str(badge.get("image", "")).strip()
                          if not icon_url:
                              continue
                          dynamic_block_lines.append(
                              f'  <a href="my-badges/{file_id}.md" title="{desc}"><img src="{icon_url}" alt="{badge_id}" width="64" /></a>'
                          )
                      dynamic_block_lines.append("</p>")
                  else:
                      dynamic_block_lines.append("_No dynamic badges generated yet._")
              except Exception:
                  dynamic_block_lines.append("_Dynamic badge data could not be parsed._")
          else:
              dynamic_block_lines.append("_No dynamic badges generated yet._")

          dyn_block = "\n".join(dynamic_block_lines)
          dyn_pattern = re.compile(
              re.escape(dyn_start_marker) + r".*?" + re.escape(dyn_end_marker),
              re.DOTALL,
          )
          dyn_replacement = f"{dyn_start_marker}\n{dyn_block}\n{dyn_end_marker}"
          new_content = dyn_pattern.sub(dyn_replacement, new_content)

          def fetch_latest_repos(username, limit, auth_token=""):
              headers = {
                  "User-Agent": "faizhussain7-profile-readme",
                  "Accept": "application/vnd.github+json",
              }
              if auth_token:
                  headers["Authorization"] = f"Bearer {auth_token}"

              repos = []
              page = 1
              while len(repos) < limit and page <= 5:
                  url = (
                      f"https://api.github.com/users/{quote(username)}/repos"
                      f"?sort=pushed&direction=desc&per_page=100&type=owner&page={page}"
                  )
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      batch = json.load(resp)
                  if not batch:
                      break
                  for repo in batch:
                      if repo.get("fork"):
                          continue
                      if repo.get("name", "").lower() == username.lower():
                          continue
                      repos.append(repo)
                      if len(repos) >= limit:
                          break
                  page += 1
              return repos[:limit]

          repo_lines = []
          try:
              latest_repos = fetch_latest_repos(user, repos_limit, token)
              if latest_repos:
                  for repo in latest_repos:
                      repo_name = str(repo.get("name", "")).strip()
                      if not repo_name:
                          continue
                      repo_url = f"https://github.com/{user}/{quote(repo_name)}"
                      card_url = (
                          "https://github-readme-stats.vercel.app/api/pin/"
                          f"?username={quote(user)}&repo={quote(repo_name)}"
                          "&theme=gruvbox&hide_border=true"
                      )
                      repo_lines.append(
                          f'[![{repo_name} Repository]({card_url})]({repo_url})'
                      )
                      repo_lines.append("")
                  repo_lines.append(
                      "**💡 Dynamic Updates:** Latest repositories are fetched automatically; "
                      "card stats refresh on every page view!"
                  )
              else:
                  repo_lines.append("_No public repositories found to display yet._")
          except (URLError, HTTPError, json.JSONDecodeError, TimeoutError):
              repo_lines.append("_Latest repositories could not be fetched right now._")

          repos_block = "\n".join(repo_lines)
          repos_pattern = re.compile(
              re.escape(repos_start_marker) + r".*?" + re.escape(repos_end_marker),
              re.DOTALL,
          )
          repos_replacement = f"{repos_start_marker}\n{repos_block}\n{repos_end_marker}"
          new_content = repos_pattern.sub(repos_replacement, new_content)

          with open(readme_path, "w", encoding="utf-8") as f:
              f.write(new_content)
          PY

      - name: Create pull request for badge updates
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-achievement-badges
          add-paths: |
            README.md
            my-badges/**
          commit-message: "chore: update dynamic achievement badges"
          title: "chore: update dynamic achievement badges"
          body: |
            Automated update of profile achievement badges and latest repositories.

            - Regenerated badges via `update-my-badges`
            - Updated README badge section and badge metadata files
            - Refreshed latest repository pin cards from the GitHub API
          delete-branch: true
